<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店舗課題対策ダッシュボード</title>
<style>
  :root{
    --navy:#2F5496;
    --navy-dark:#1f3a6b;
    --blue-light:#DDEBF7;
    --gray-light:#F2F2F2;
    --border:#D9D9D9;
    --text:#222;
    --muted:#767676;
    --danger:#C00000;
    --white:#fff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    background:#F5F6F8;
    color:var(--text);
    padding:0 0 60px 0;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 24px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 4px 0;
    font-size:20px;
  }
  header p{
    margin:0;
    font-size:12px;
    color:#dce6f5;
  }
  .toolbar{
    max-width:1000px;
    margin:16px auto 0 auto;
    padding:0 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    justify-content:space-between;
  }
  .toolbar .left, .toolbar .right{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:13px;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-small{padding:4px 10px;font-size:12px;}

  main{
    max-width:1000px;
    margin:20px auto;
    padding:0 16px;
  }

  .search-box{
    margin-bottom:16px;
  }
  .search-box input{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    border:1px solid var(--border);
    border-radius:6px;
    font-family:inherit;
  }

  .issue-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .issue-header{
    background:var(--blue-light);
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
  }
  .issue-header .toggle{
    font-size:12px;
    color:var(--navy-dark);
    width:16px;
    flex-shrink:0;
    transition:transform .15s;
  }
  .issue-card.collapsed .toggle{transform:rotate(-90deg);}
  .issue-title{
    flex:1;
    font-weight:700;
    font-size:15px;
    color:var(--navy-dark);
  }
  .issue-title[contenteditable="true"]{
    outline:2px dashed var(--navy);
    outline-offset:2px;
    background:#fff;
    padding:2px 4px;
    border-radius:4px;
  }
  .issue-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .issue-body{
    padding:12px 16px 16px 16px;
  }
  .issue-card.collapsed .issue-body{display:none;}

  .checkpoint-block{
    border-left:3px solid var(--navy);
    background:var(--gray-light);
    border-radius:0 6px 6px 0;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .checkpoint-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
  }
  .checkpoint-label{
    font-size:11px;
    font-weight:700;
    color:var(--navy);
    background:#fff;
    border:1px solid var(--navy);
    border-radius:4px;
    padding:2px 6px;
    flex-shrink:0;
    margin-top:2px;
  }
  .checkpoint-text{
    flex:1;
    font-size:13.5px;
    font-weight:600;
  }
  .checkpoint-text[contenteditable="true"]{
    outline:2px dashed var(--navy);
    outline-offset:2px;
    background:#fff;
    padding:2px 4px;
    border-radius:4px;
  }
  .measures{
    list-style:none;
    margin:0;
    padding:0;
  }
  .measure-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 0 6px 20px;
    font-size:13px;
    border-top:1px dashed var(--border);
  }
  .measure-item:first-child{border-top:none;}
  .measure-bullet{
    color:var(--navy);
    flex-shrink:0;
  }
  .measure-text{
    flex:1;
  }
  .measure-text[contenteditable="true"]{
    outline:2px dashed var(--navy);
    outline-offset:2px;
    background:#fff;
    padding:2px 4px;
    border-radius:4px;
  }
  .row-actions{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .icon-btn{
    background:transparent;
    border:none;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
    padding:2px 6px;
    border-radius:4px;
  }
  .icon-btn:hover{background:#e8e8e8;color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger);}

  .add-line{
    font-size:12.5px;
    color:var(--navy);
    background:none;
    border:1px dashed var(--navy);
    border-radius:6px;
    padding:5px 10px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-line:hover{background:var(--blue-light);}

  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }

  .fab{
    position:fixed;
    right:24px;
    bottom:24px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:50px;
    padding:14px 22px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    cursor:pointer;
    z-index:15;
  }
  .fab:hover{background:var(--navy-dark);}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:#333;
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:100;
  }
  .toast.show{opacity:1;}

  #importFileInput{display:none;}

  .meta-line{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    max-width:1000px;
    margin:4px auto 0 auto;
    padding:0 16px;
  }

  /* ---- Print / PDF ---- */
  @media print{
    header, .toolbar, .fab, .search-box, .add-line, .issue-actions,
    .row-actions, .toast{
      display:none !important;
    }
    body{background:#fff;padding:0;}
    main{max-width:100%;margin:0;padding:0;}
    .issue-card{
      break-inside:avoid;
      border:1px solid #999;
      margin-bottom:12px;
    }
    .issue-card.collapsed .issue-body{display:block !important;}
    .issue-header{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .checkpoint-block{background:#f7f7f7 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    [contenteditable]{outline:none !important;}
  }
</style>
</head>
<body>

<header>
  <h1>店舗課題 対策検討ダッシュボード</h1>
  <p>店舗の課題 → チェックポイント → 対策内容案</p>
</header>

<div class="toolbar">
  <div class="left">
    <button class="btn-secondary btn-small" id="exportBtn">📤 JSON書き出し</button>
    <button class="btn-secondary btn-small" id="importBtn">📥 JSON読み込み</button>
    <input type="file" id="importFileInput" accept="application/json">
  </div>
  <div class="right">
    <button class="btn-secondary btn-small" id="expandAllBtn">すべて開く</button>
    <button class="btn-secondary btn-small" id="collapseAllBtn">すべて閉じる</button>
    <button class="btn-primary btn-small" id="printBtn">🖨 PDF出力</button>
  </div>
</div>

<main>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="課題・チェックポイント・対策内容で検索...">
  </div>
  <div id="issueList"></div>
</main>

<button class="fab" id="addIssueBtn">＋ 課題を追加</button>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "storeIssueDashboardData_v1";

  var seedData = {
    updatedAt: null,
    issues: [
      {
        id: uid(),
        title: "アルバイトの定着率が低い",
        checkpoints: [
          {
            id: uid(),
            text: "入店時のオンボーディングが実施されているか",
            measures: [
              "入店1週間以内にフォロー面談を実施する",
              "新人用マニュアルを整備し初日に共有する"
            ]
          },
          {
            id: uid(),
            text: "シフトの融通が利く運用になっているか",
            measures: [
              "希望シフト提出フォームを導入する",
              "SVが月1回シフト相談の場を設ける"
            ]
          }
        ]
      },
      {
        id: uid(),
        title: "客単価が伸び悩んでいる",
        checkpoints: [
          {
            id: uid(),
            text: "スタッフからのおすすめ提案がされているか",
            measures: ["おすすめトーク研修を実施する"]
          },
          {
            id: uid(),
            text: "季節メニューが店頭で告知されているか",
            measures: [
              "POPを追加設置する",
              "SNSでの告知を強化する"
            ]
          }
        ]
      }
    ]
  };

  var data = loadData();
  var collapsedIds = {}; // issueId -> true/false
  var searchTerm = "";

  function uid(){
    return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
  }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.issues)) return parsed;
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(seedData));
  }

  function saveData(){
    data.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ---------- CRUD ----------
  function addIssue(){
    var title = prompt("店舗の課題を入力してください");
    if(!title || !title.trim()) return;
    data.issues.push({ id: uid(), title: title.trim(), checkpoints: [] });
    saveData();
  }

  function deleteIssue(issueId){
    if(!confirm("この課題を削除しますか？（チェックポイント・対策も全て削除されます）")) return;
    data.issues = data.issues.filter(function(i){ return i.id !== issueId; });
    saveData();
  }

  function addCheckpoint(issueId){
    var text = prompt("チェックポイントを入力してください");
    if(!text || !text.trim()) return;
    var issue = findIssue(issueId);
    if(!issue) return;
    issue.checkpoints.push({ id: uid(), text: text.trim(), measures: [] });
    saveData();
  }

  function deleteCheckpoint(issueId, cpId){
    if(!confirm("このチェックポイントを削除しますか？（対策内容案も全て削除されます）")) return;
    var issue = findIssue(issueId);
    if(!issue) return;
    issue.checkpoints = issue.checkpoints.filter(function(c){ return c.id !== cpId; });
    saveData();
  }

  function addMeasure(issueId, cpId){
    var text = prompt("対策内容案を入力してください");
    if(!text || !text.trim()) return;
    var cp = findCheckpoint(issueId, cpId);
    if(!cp) return;
    cp.measures.push(text.trim());
    saveData();
  }

  function deleteMeasure(issueId, cpId, idx){
    var cp = findCheckpoint(issueId, cpId);
    if(!cp) return;
    cp.measures.splice(idx, 1);
    saveData();
  }

  function findIssue(issueId){
    return data.issues.filter(function(i){ return i.id === issueId; })[0];
  }
  function findCheckpoint(issueId, cpId){
    var issue = findIssue(issueId);
    if(!issue) return null;
    return issue.checkpoints.filter(function(c){ return c.id === cpId; })[0];
  }

  // ---------- inline edit ----------
  function makeEditable(el, onCommit){
    el.setAttribute("contenteditable", "true");
    el.focus();
    document.execCommand && placeCaretAtEnd(el);
    function commit(){
      el.removeAttribute("contenteditable");
      el.removeEventListener("blur", commit);
      el.removeEventListener("keydown", onKeydown);
      var text = el.textContent.trim();
      if(text) onCommit(text);
      else saveData(); // revert to original via re-render
    }
    function onKeydown(e){
      if(e.key === "Enter"){ e.preventDefault(); el.blur(); }
      if(e.key === "Escape"){ e.preventDefault(); render(); }
    }
    el.addEventListener("blur", commit);
    el.addEventListener("keydown", onKeydown);
  }

  function placeCaretAtEnd(el){
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ---------- render ----------
  function matchesSearch(issue){
    if(!searchTerm) return true;
    var t = searchTerm.toLowerCase();
    if(issue.title.toLowerCase().indexOf(t) !== -1) return true;
    return issue.checkpoints.some(function(cp){
      if(cp.text.toLowerCase().indexOf(t) !== -1) return true;
      return cp.measures.some(function(m){ return m.toLowerCase().indexOf(t) !== -1; });
    });
  }

  function render(){
    var list = document.getElementById("issueList");
    list.innerHTML = "";

    var visibleIssues = data.issues.filter(matchesSearch);

    if(visibleIssues.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = searchTerm ? "該当する項目が見つかりません" : "課題がまだ登録されていません。右下の「＋ 課題を追加」から始めてください。";
      list.appendChild(empty);
      return;
    }

    visibleIssues.forEach(function(issue){
      var card = document.createElement("div");
      card.className = "issue-card" + (collapsedIds[issue.id] ? " collapsed" : "");

      // header
      var header = document.createElement("div");
      header.className = "issue-header";

      var toggle = document.createElement("span");
      toggle.className = "toggle";
      toggle.textContent = "▼";
      header.appendChild(toggle);

      var titleEl = document.createElement("div");
      titleEl.className = "issue-title";
      titleEl.textContent = issue.title;
      titleEl.addEventListener("click", function(e){
        e.stopPropagation();
      });
      titleEl.addEventListener("dblclick", function(e){
        e.stopPropagation();
        makeEditable(titleEl, function(text){
          issue.title = text;
          saveData();
        });
      });
      header.appendChild(titleEl);

      var actions = document.createElement("div");
      actions.className = "issue-actions";
      var delIssueBtn = document.createElement("button");
      delIssueBtn.className = "icon-btn danger";
      delIssueBtn.textContent = "🗑";
      delIssueBtn.title = "課題を削除";
      delIssueBtn.addEventListener("click", function(e){
        e.stopPropagation();
        deleteIssue(issue.id);
      });
      actions.appendChild(delIssueBtn);
      header.appendChild(actions);

      header.addEventListener("click", function(){
        collapsedIds[issue.id] = !collapsedIds[issue.id];
        render();
      });

      card.appendChild(header);

      // body
      var body = document.createElement("div");
      body.className = "issue-body";

      issue.checkpoints.forEach(function(cp){
        var block = document.createElement("div");
        block.className = "checkpoint-block";

        var cpRow = document.createElement("div");
        cpRow.className = "checkpoint-row";

        var label = document.createElement("span");
        label.className = "checkpoint-label";
        label.textContent = "チェック";
        cpRow.appendChild(label);

        var cpText = document.createElement("div");
        cpText.className = "checkpoint-text";
        cpText.textContent = cp.text;
        cpText.addEventListener("dblclick", function(){
          makeEditable(cpText, function(text){
            cp.text = text;
            saveData();
          });
        });
        cpRow.appendChild(cpText);

        var cpActions = document.createElement("div");
        cpActions.className = "row-actions";
        var delCpBtn = document.createElement("button");
        delCpBtn.className = "icon-btn danger";
        delCpBtn.textContent = "🗑";
        delCpBtn.title = "チェックポイントを削除";
        delCpBtn.addEventListener("click", function(){
          deleteCheckpoint(issue.id, cp.id);
        });
        cpActions.appendChild(delCpBtn);
        cpRow.appendChild(cpActions);

        block.appendChild(cpRow);

        var measuresList = document.createElement("ul");
        measuresList.className = "measures";
        cp.measures.forEach(function(m, idx){
          var li = document.createElement("li");
          li.className = "measure-item";

          var bullet = document.createElement("span");
          bullet.className = "measure-bullet";
          bullet.textContent = "▸";
          li.appendChild(bullet);

          var mText = document.createElement("div");
          mText.className = "measure-text";
          mText.textContent = m;
          mText.addEventListener("dblclick", function(){
            makeEditable(mText, function(text){
              cp.measures[idx] = text;
              saveData();
            });
          });
          li.appendChild(mText);

          var mActions = document.createElement("div");
          mActions.className = "row-actions";
          var delMBtn = document.createElement("button");
          delMBtn.className = "icon-btn danger";
          delMBtn.textContent = "🗑";
          delMBtn.title = "対策内容案を削除";
          delMBtn.addEventListener("click", function(){
            deleteMeasure(issue.id, cp.id, idx);
          });
          mActions.appendChild(delMBtn);
          li.appendChild(mActions);

          measuresList.appendChild(li);
        });
        block.appendChild(measuresList);

        var addMeasureBtn = document.createElement("button");
        addMeasureBtn.className = "add-line";
        addMeasureBtn.textContent = "＋ 対策内容案を追加";
        addMeasureBtn.addEventListener("click", function(){
          addMeasure(issue.id, cp.id);
        });
        block.appendChild(addMeasureBtn);

        body.appendChild(block);
      });

      var addCpBtn = document.createElement("button");
      addCpBtn.className = "add-line";
      addCpBtn.textContent = "＋ チェックポイントを追加";
      addCpBtn.addEventListener("click", function(){
        addCheckpoint(issue.id);
      });
      body.appendChild(addCpBtn);

      card.appendChild(body);
      list.appendChild(card);
    });
  }

  // ---------- import / export ----------
  function exportJson(){
    data.updatedAt = new Date().toISOString();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "store_issue_dashboard_" + ts + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("JSONファイルを書き出しました");
  }

  function importJson(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        if(!parsed || !Array.isArray(parsed.issues)) throw new Error("invalid format");
        var mode = confirm(
          "読み込んだ内容で現在のデータを「置き換え」ますか？\nOK＝置き換え / キャンセル＝末尾に追加（マージ）"
        );
        if(mode){
          data = parsed;
        }else{
          parsed.issues.forEach(function(issue){
            issue.id = uid();
            issue.checkpoints.forEach(function(cp){ cp.id = uid(); });
            data.issues.push(issue);
          });
        }
        saveData();
        showToast("JSONファイルを読み込みました");
      }catch(err){
        alert("ファイルの読み込みに失敗しました。正しいJSON形式か確認してください。");
      }
    };
    reader.readAsText(file, "UTF-8");
  }

  // ---------- events ----------
  document.getElementById("addIssueBtn").addEventListener("click", addIssue);
  document.getElementById("exportBtn").addEventListener("click", exportJson);
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFileInput").click();
  });
  document.getElementById("importFileInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(file) importJson(file);
    e.target.value = "";
  });
  document.getElementById("printBtn").addEventListener("click", function(){
    collapsedIds = {};
    render();
    setTimeout(function(){ window.print(); }, 50);
  });
  document.getElementById("expandAllBtn").addEventListener("click", function(){
    collapsedIds = {};
    render();
  });
  document.getElementById("collapseAllBtn").addEventListener("click", function(){
    data.issues.forEach(function(i){ collapsedIds[i.id] = true; });
    render();
  });
  document.getElementById("searchInput").addEventListener("input", function(e){
    searchTerm = e.target.value.trim();
    render();
  });

  render();
})();
</script>

</body>
</html>
